# Railway configuration for the AI Fake News Detector.
# Deploy: railway.app -> New Project -> Deploy from GitHub -> this repo.
# Then add the secret env vars in the Variables tab (TAVILY_API_KEY, OPENAI_API_KEY, ...).

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
